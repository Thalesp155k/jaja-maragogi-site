<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Passeios de buggy pelo Litoral Norte, Litoral Sul e Ponta a Ponta de Maragogi, com atendimento local e paradas para fotos."
    />
    <meta name="theme-color" content="#013f5a" />
    <title>Jajá Maragogi | Passeios de Buggy</title>
    <link rel="icon" href="/favicon.svg" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18430222845"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-18430222845');
    </script>
    <!-- Contato: conversao ao clicar nos links do WhatsApp -->
    <script>
      function gtag_report_conversion() {
        gtag('event', 'conversion', {
          'send_to': 'AW-18430222845/1jfdCOGnqu4cEP3Dm9RE',
          'value': 1.0,
          'currency': 'BRL'
        });
        return false;
      }
      document.addEventListener('click', function (event) {
        var link = event.target instanceof Element ? event.target.closest('a[href]') : null;
        if (!link) return;
        var destination = new URL(link.href, window.location.href);
        if (destination.hostname === 'wa.me' || destination.hostname === 'api.whatsapp.com') {
          gtag_report_conversion();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
